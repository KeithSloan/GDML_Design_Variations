# Detector: a cylindrical scintillation crystal in an aluminium housing,
# viewing a Cs-137 point source.  Which crystal material and size gives the
# highest full-energy-peak efficiency?
# Built by build.py, analysed by metrics.py.

[study]
name = "detector"
title = "Gamma-ray crystal detector (Cs-137, 662 keV)"
description = """
A cylindrical crystal (axis along z, front face 1 mm behind z = 0) inside a
1 mm aluminium housing.  A 662 keV point source 100 mm in front emits into a
30 degree cone about the axis.  A thin vacuum monitor disc behind the
detector counts photons of a second, pencil-beam source that cross the
detector without interacting - a check of the crystal's attenuation, and so
of the material definitions, against NIST data.  The variants change the
crystal material (including two defined here with addMaterial) and size.
"""
objective = """
Highest absolute full-energy-peak efficiency at 662 keV; report the
peak-to-total ratio and crystal mass as the trade-offs.
"""
primary_metric = "peak_efficiency_abs"
better = "higher"

[world]
size_mm = [300.0, 300.0, 500.0]
material = "G4_Galactic"

# Materials not in Geant4's NIST list, defined in every document with
# GDMLDesign.addMaterial (formula = atoms per formula unit).
[materials.LYSO]
density = "7.1 g/cm3"
formula = "Lu9Y1Si5O25"        # Lu1.8 Y0.2 SiO5 (Ce doping ignored)

[materials.LaBr3]
density = "5.08 g/cm3"
formula = "LaBr3"              # Ce doping ignored

[defaults]
housing_mm = 1.0
housing_material = "G4_Al"
monitor_gap_mm = 5.0

[[variants]]
name = "NaI_1p5in"
material = "G4_SODIUM_IODIDE"
radius_mm = 19.05
length_mm = 38.1
note = "1.5 x 1.5 inch NaI(Tl), reference"

[[variants]]
name = "NaI_3in"
material = "G4_SODIUM_IODIDE"
radius_mm = 38.1
length_mm = 76.2
note = "3 x 3 inch NaI(Tl)"

[[variants]]
name = "CsI_1p5in"
material = "G4_CESIUM_IODIDE"
radius_mm = 19.05
length_mm = 38.1

[[variants]]
name = "BGO_1p5in"
material = "G4_BGO"
radius_mm = 19.05
length_mm = 38.1

[[variants]]
name = "LYSO_1p5in"
material = "LYSO"
radius_mm = 19.05
length_mm = 38.1

[[variants]]
name = "LaBr3_1p5in"
material = "LaBr3"
radius_mm = 19.05
length_mm = 38.1

# --- round 2 (proposed in docs/results/round1/detector/REVIEW.md, approved)
[[variants]]
name = "BGO_2in"
material = "G4_BGO"
radius_mm = 25.4
length_mm = 50.8
note = "round 2: does BGO's lead persist at a larger size?"

[[variants]]
name = "BGO_eqmass_NaI3in"
material = "G4_BGO"
radius_mm = 30.5
length_mm = 61.1
note = "round 2: same mass as NaI_3in (1.27 kg), length = diameter"

[[variants]]
name = "LYSO_2in"
material = "LYSO"
radius_mm = 25.4
length_mm = 50.8
note = "round 2: LYSO at the size of BGO_2in"

[physics]
lists = ["FTFP_BERT", "FTFP_BERT_EMZ", "FTFP_BERT_LIV"]

[[sources]]
name = "Cs137_cone"
particle = "gamma"
energy_MeV = 0.661657
position_mm = [0.0, 0.0, -100.0]
cone_half_angle_deg = 30.0
events = 100000
note = "covers the largest crystal (3 inch at 100 mm subtends 21 deg)"

[[sources]]
name = "Cs137_pencil"
particle = "gamma"
energy_MeV = 0.661657
position_mm = [0.0, 0.0, -100.0]
direction = [0.0, 0.0, 1.0]
events = 50000
note = "attenuation check through the detector axis"

[mesh]
half_size_mm = [50.0, 50.0, 60.0]
centre_mm = [0.0, 0.0, 45.0]
bins = [50, 50, 60]
physics = ["FTFP_BERT"]

[analysis]
compare = ["peak_efficiency_abs", "total_efficiency_abs", "peak_to_total",
           "uncollided_fraction", "resolved_peak_efficiency_abs", "peak_purity",
           "peak_to_compton"]
plot = ["peak_efficiency_abs", "total_efficiency_abs", "peak_to_total",
        "uncollided_fraction", "resolved_peak_efficiency_abs", "peak_purity",
        "peak_to_compton"]

[resolution]
# Typical FWHM energy resolution at 662 keV (fraction of the energy) of each
# crystal with a photomultiplier, applied by metrics.py as Gaussian smearing
# of the deposited energy (sigma scaling as sqrt(E)).  Proposed in the
# round-1 detector review so that crystals are compared with a realistic
# peak window.  Published typical values - real detectors vary with size,
# quality and readout; edit to match yours.
#   NaI(Tl) 7 %; CsI(Tl) 8-9 %; BGO 8-12 %: berkeleynucleonics.com
#     technical note "Choosing a scintillator" (ScintIQ datasheet values)
#   LYSO 7-8 %: IEEE TechNav, "Solid scintillation detectors"
#   LaBr3(Ce) 3.0 % typical (berkeleynucleonics.com, LaBr3 datasheet);
#     2.6 % standard grade (Luxium lanthanum material data sheet)
[resolution.fwhm_662keV]
"G4_SODIUM_IODIDE" = 0.070
"G4_CESIUM_IODIDE" = 0.085
"G4_BGO" = 0.10
"LYSO" = 0.075
"LaBr3" = 0.030

[reference]
# mu/rho (cm2/g, with coherent) at 661.657 keV from tools/attenuation_refs.py
[reference.mu_rho_cm2_g]
"G4_Al" = 0.07466
"G4_SODIUM_IODIDE" = 0.076649
"G4_CESIUM_IODIDE" = 0.077555
"G4_BGO" = 0.099826
"LYSO" = 0.089113
"LaBr3" = 0.074094

[checks]
uncollided_rel_tol = 0.02
peak_window_MeV = 0.002        # full-energy peak: E >= E0 - window
threshold_MeV = 0.010          # counted at all: E >= threshold
peak_window_fwhm = 1.0         # resolved peak window: E0 +- this x FWHM
compton_region_MeV = [0.358, 0.382]   # Compton plateau for peak-to-Compton (Cs-137)
